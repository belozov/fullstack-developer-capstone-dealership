<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Cars Dealerships</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
<script>
const logout = async () => {
  let logout_url = window.location.origin + "/djangoapp/logout";
  try {
    let username = sessionStorage.getItem("username");
    const res = await fetch(logout_url, {
      method: "GET"
    });
    const json = await res.json();
    if (json) {
      sessionStorage.removeItem("username");
      alert("Logging out " + (username || "") + "...");
      window.location.href = window.location.origin;
    }
  } catch (error) {
    console.error("Logout error:", error);
    sessionStorage.removeItem("username");
    window.location.href = window.location.origin;
  }
};

let checkSession = () => {
  let curr_user = sessionStorage.getItem("username");

  if (curr_user && curr_user !== "") {
    document.getElementById("loginlogout").innerHTML = 
      '<span class="homepage_links text-dark fw-bold me-3">' + curr_user + '</span>' +
      '<a class="homepage_links btn btn-outline-dark btn-sm" onclick="logout()" href="javascript:void(0);">Logout</a>';
  } else {
    document.getElementById("loginlogout").innerHTML = 
      '<a class="homepage_links me-2" href="/login">Login</a>' +
      '<a class="homepage_links" href="/register">Register</a>';
  }
};
</script>
</head>
<body onload="checkSession()">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%;">Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" style="font-size: larger;" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
        </li>
      </ul>
      <span class="navbar-text">
        <div class="loginlink" id="loginlogout">
        </div>
      </span>
    </div>
  </div>
</nav>

<div style="display: flex; flex-direction: column; align-items: center; padding: 40px 20px;">
  <div class="card shadow" style="width: 60%; max-width: 800px; border-radius: 12px; overflow: hidden;">
    <img src="/static/car_dealership.jpg" class="card-img-top" alt="Car Dealership" style="max-height: 400px; object-fit: cover;">
    <div class="card-body text-center p-4">
      <h3 class="card-title fw-bold">Welcome to our Dealerships!</h3>
      <p class="card-text text-muted">
        Explore premier automobile dealerships across the United States, read real customer reviews with sentiment analysis, and share your own dealership experience.
      </p>
      <a href="/dealers" class="btn btn-lg fw-bold text-dark mt-2" style="background-color: darkturquoise; padding: 10px 30px;">
        View Dealerships
      </a>
    </div>
  </div>
</div>
</body>
</html>
